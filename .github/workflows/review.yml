name: review

on:
  pull_request:
    types: [labeled, unlabeled]

jobs:
  review:
    name: Review with slop-police
    if: github.event.action == 'labeled' && github.event.label.name == 'slop-police'
    concurrency:
      group: slop-police-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The released action reviews a pull request here, as in any other repository: the pull request's own copy of the engine never runs with the key.
      - name: Review
        uses: wzslr321/slop-police@v1
        with:
          base: ${{ github.event.pull_request.base.sha }}
          codex-api-key: ${{ secrets.CODEX_API_KEY }}

  # Joining the group of the review is what cancels it.
  stop:
    name: Stop the review
    if: github.event.action == 'unlabeled' && github.event.label.name == 'slop-police'
    concurrency:
      group: slop-police-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Stop
        run: echo "The label slop-police was removed."

  post:
    name: Post the review
    needs: review
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post
        uses: wzslr321/slop-police/post@v1
